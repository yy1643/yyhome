<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="YY 的视频作品、摄影项目与软件作品集。" />
  <meta name="theme-color" content="#dce6ef" />
  <meta property="og:title" content="YY · 作品集" />
  <meta property="og:description" content="查看 YY 的视频、摄影与软件项目。" />
  <meta property="og:type" content="website" />
  <title>YY · 作品集</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <!-- 字体预连接 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- 样式表 -->
  <link rel="stylesheet" href="styles.css?v=6">
  <style>
    /* 作品集独立页面专属样式 */
    a.card {
      display: block;
      text-decoration: none;
      color: inherit;
    }
    .works-page {
      animation: rise .65s both;
    }
    .back-link {
      font-size: 12px;
      color: #61798e;
      text-decoration: none;
      transition: color .2s;
    }
    .back-link:hover {
      color: #263b55;
    }
    body.night .back-link {
      color: #9eb3c8;
    }
    body.night .back-link:hover {
      color: #edf3f8;
    }
  </style>
</head>
<body>
  <main class="shell">
    <!-- 顶栏 -->
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">YY</span>
        <span>YY / VISUALS</span>
      </div>
      <div class="top-actions">
        <button class="icon-btn" type="button" data-theme-toggle aria-label="切换主题" aria-pressed="false">◐</button>
      </div>
    </header>

    <!-- 页面标题 -->
    <div class="section-title works-page">
      <h2>作品集</h2>
      <a class="back-link" href="index.html">← 返回首页</a>
    </div>

    <!-- 作品卡片网格 -->
    <section class="detail-grid works-page">
      <!-- 街头采访·杭州篇 -->
      <article class="card detail-card">
        <div class="project-icon">◉</div>
        <h3>街头采访 · 杭州篇</h3>
        <p>用一台手机记录陌生人的一天，收获 823 万次播放。</p>
      </article>

      <!-- YY 音频助手（可点击跳转 app.html） -->
      <a href="app.html" class="card detail-card app-card">
        <div class="project-icon" style="background:#e8f0ff;color:#4a7de8">◈</div>
        <h3>YY 音频助手</h3>
        <p>我的第一款 AI 软件 · 视频一键转音频，提取到 U 盘</p>
      </a>

      <!-- 别刷了（可点击跳转 just-stop.html） -->
      <a href="just-stop.html" class="card detail-card app-card">
        <img class="project-icon project-icon-image" src="assets/just-stop-icon.png" width="1254" height="1254" alt="别刷了软件图标">
        <h3>别刷了</h3>
        <p>限制容易分心的应用 · 到点自动跳转并开启专注锁定</p>
      </a>

      <!-- 手机摄影手册 -->
      <article class="card detail-card">
        <div class="project-icon" style="background:#e7f5ef;color:#58a27f">✺</div>
        <h3>手机摄影手册</h3>
        <p>整理 30 个构图与用光技巧，帮助新手快速上手。</p>
      </article>

      <!-- 城市声音计划 -->
      <article class="card detail-card">
        <div class="project-icon" style="background:#f1eaff;color:#866bc4">⌁</div>
        <h3>城市声音计划</h3>
        <p>收集城市环境声，做成一组 60 秒声音短片。</p>
      </article>
    </section>
  </main>

  <!-- 底部 Dock 导航（a 标签，作品按钮 active） -->
  <nav class="dock" aria-label="页面导航">
    <a class="dock-btn" href="index.html" aria-label="首页">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 11 9-8 9 8v9H3z"/><path d="M9 20v-6h6v6"/></svg>
      <span>首页</span>
    </a>
    <a class="dock-btn active" href="works.html" aria-label="作品集" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m10 9 5 3-5 3z"/></svg>
      <span>作品</span>
    </a>
    <a class="dock-btn" href="ideas.html" aria-label="一些想法">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18h6m-5 3h4"/><path d="M8.3 15.5A7 7 0 1 1 15.7 15.5C15 16 15 17 15 18H9c0-1 0-2-.7-2.5Z"/></svg>
      <span>想法</span>
    </a>
    <a class="dock-btn" href="contact.html" aria-label="联系我">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4Z"/></svg>
      <span>联系</span>
    </a>
  </nav>

  <!-- 脚本 -->
  <script src="script.js?v=2"></script>
</body>
</html>
