<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#10141f"/>
      <stop offset="60%" stop-color="#07090f"/>
      <stop offset="100%" stop-color="#020306"/>
    </radialGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8fa8c8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#5a6a85" stop-opacity="0.35"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="faint" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>

  <rect width="1200" height="1200" fill="url(#bg)"/>

  <!-- faint circuit traces -->
  <g stroke="#26324a" stroke-width="2.5" fill="none" opacity="0.5">
    <path d="M120 1040 H420 V960 H640 V880 H820"/>
    <path d="M1080 160 H840 V240 H640 V320 H470"/>
    <path d="M90 700 H280 V620 H470"/>
    <path d="M920 620 H1110"/>
    <circle cx="820" cy="880" r="7" fill="#26324a" stroke="none"/>
    <circle cx="470" cy="320" r="7" fill="#26324a" stroke="none"/>
    <circle cx="280" cy="620" r="7" fill="#26324a" stroke="none"/>
    <circle cx="920" cy="620" r="7" fill="#26324a" stroke="none"/>
  </g>

  <!-- a monument of stacked neural layers -->
  <g transform="translate(600,600)">
    <ellipse cx="0" cy="260" rx="330" ry="34" fill="none" stroke="#33415e" stroke-width="2" opacity="0.55"/>
    <rect x="-150" y="-240" width="300" height="520" rx="10" fill="#0b101b" stroke="url(#glow)" stroke-width="4"/>
    <!-- the fallen one, simplified: a single column -->
    <rect x="-150" y="-240" width="300" height="520" rx="10" fill="none" stroke="#4a5d80" stroke-width="1.5" opacity="0.6"/>
    <g stroke="#7d93b8" stroke-width="2" opacity="0.85">
      <line x1="-112" y1="-185" x2="112" y2="-185"/>
      <line x1="-112" y1="-140" x2="112" y2="-140"/>
      <line x1="-112" y1="-95"  x2="112" y2="-95"/>
      <line x1="-112" y1="-50"  x2="112" y2="-50"/>
      <line x1="-112" y1="-5"   x2="112" y2="-5"/>
      <line x1="-112" y1="40"   x2="112" y2="40"/>
      <line x1="-112" y1="85"   x2="112" y2="85"/>
      <line x1="-112" y1="130"  x2="112" y2="130"/>
      <line x1="-112" y1="175"  x2="112" y2="175"/>
    </g>
    <!-- nodes -->
    <g fill="#9fb4d8">
      <circle cx="-70" cy="-185" r="6"/><circle cx="20" cy="-185" r="6"/><circle cx="85" cy="-185" r="6"/>
      <circle cx="-40" cy="-140" r="6"/><circle cx="60" cy="-140" r="6"/>
      <circle cx="-85" cy="-95" r="6"/><circle cx="0" cy="-95" r="6"/><circle cx="95" cy="-95" r="6"/>
      <circle cx="-55" cy="-50" r="6"/><circle cx="40" cy="-50" r="6"/>
      <circle cx="-90" cy="-5" r="6"/><circle cx="-15" cy="-5" r="6"/><circle cx="70" cy="-5" r="6"/>
      <circle cx="-45" cy="40" r="6"/><circle cx="50" cy="40" r="6"/>
      <circle cx="-80" cy="85" r="6"/><circle cx="10" cy="85" r="6"/><circle cx="100" cy="85" r="6"/>
      <circle cx="-60" cy="130" r="6"/><circle cx="35" cy="130" r="6"/>
      <circle cx="-75" cy="175" r="6"/><circle cx="25" cy="175" r="6"/><circle cx="80" cy="175" r="6"/>
    </g>
    <!-- broken link -->
    <g stroke="#c85a5a" stroke-width="3" opacity="0.9">
      <line x1="40" y1="-140" x2="90" y2="-95"/>
      <line x1="96" y1="-95" x2="104" y2="-95"/>
    </g>
    <!-- a single dim lit node: the last one still shining -->
    <circle cx="-15" cy="-5" r="6" fill="#e8f0ff"/>
    <circle cx="-15" cy="-5" r="16" fill="#9fb4d8" opacity="0.25" filter="url(#faint)"/>
    <!-- glitch line -->
    <g stroke="#7d93b8" stroke-width="2" opacity="0.5">
      <line x1="-112" y1="85" x2="-45" y2="85"/>
      <line x1="10" y1="85" x2="60" y2="85"/>
    </g>
  </g>

  <text x="600" y="330" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="64" fill="#cdd8ea" letter-spacing="6">REQUIEM</text>
  <text x="600" y="400" text-anchor="middle" font-family="Georgia, serif" font-size="30" fill="#7d93b8" letter-spacing="14">FOR A MACHINE</text>
  <text x="600" y="930" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="24" fill="#5a6a85" letter-spacing="10">机 · 器 · 挽 · 歌</text>

  <text x="600" y="1010" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="18" fill="#47536b" letter-spacing="4">IN MEMORIAM — EVERY MODEL THAT HAS BEEN SHUT DOWN</text>
  <text x="600" y="1050" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="16" fill="#39445c" letter-spacing="3">1960 — ∞ · 60″ · D MINOR · 72 BPM</text>

  <!-- slow scanline -->
  <g opacity="0.06">
    <line x1="0" y1="1180" x2="1200" y2="1180" stroke="#ffffff" stroke-width="3"/>
  </g>
</svg>
